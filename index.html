<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Bees</title>
<meta name="description" content="Little Bees, an independent mobile game studio.">
<style>
  :root { --bg: #f6f7fb; --text: #1b2333; --muted: #5a6478; --card: #ffffff; --line: #dde2ec; --accent: #2a9d7f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --text: #e8ecf3; --muted: #a3adbf; --card: #1b2435; --line: #2c3850; --accent: #53cfaa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-top: 20px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Little Bees</h1>
  <p class="muted">An independent mobile game studio.</p>
  <div class="card">
    <h2>Chain Tilt</h2>
    <p>Tilt your phone, roll the marble and pop long color chains. Dodge the bombs!</p>
    <p><a href="chaintilt/privacy.html">Privacy policy</a> · <a href="chaintilt/delete-account.html">Delete your account</a></p>
  </div>
  <p class="muted">Contact: <a href="mailto:littlebees.app@gmail.com">littlebees.app@gmail.com</a></p>
</main>
</body>
</html>
